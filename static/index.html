<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read for Sleep</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #08070C;
      --panel: #110F18;
      --panel-2: #181620;
      --field: #1F1C2C;
      --panel-hi: #221F30;
      --ink: #E4E1F0;
      --line: #000004;
      --accent: #5E5286;
      --accent-h: #6B5F93;
      --accent-2: #45547E;
      --hi: #F58A2E;
      --hot: #FF4D6D;
      --muted: #8A84A6;
      --danger: #FF4D6D;
      --ok: #2DBF87;
      --shadow: 6px 6px 0 #000003;
      --shadow-sm: 3px 3px 0 #000003;
      --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.4;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 14px;
    }

    /* Night sky / starfield comment*/
    .sky {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(120% 80% at 82% -10%, #261c40 0%, transparent 58%),
        radial-gradient(110% 75% at -5% 108%, #16203f 0%, transparent 55%);
    }
    .sky::before, .sky::after { content: ""; position: absolute; inset: -50%; background-repeat: repeat; }
    .sky::before {
      background-image:
        radial-gradient(1.5px 1.5px at 40px 60px, #ffffff, transparent),
        radial-gradient(1px 1px at 130px 100px, #cdd6ff, transparent),
        radial-gradient(1.5px 1.5px at 220px 180px, #ffffff, transparent),
        radial-gradient(1px 1px at 300px 40px, #b8a6ff, transparent),
        radial-gradient(1px 1px at 90px 250px, #ffd9a8, transparent),
        radial-gradient(1.5px 1.5px at 370px 300px, #ffffff, transparent),
        radial-gradient(1px 1px at 470px 150px, #a8c5ff, transparent),
        radial-gradient(1.5px 1.5px at 540px 320px, #ff9d7a, transparent);
      background-size: 600px 420px;
      animation: twinkle 6s ease-in-out infinite;
    }
    .sky::after {
      background-image:
        radial-gradient(1px 1px at 60px 120px, #ffffff, transparent),
        radial-gradient(1px 1px at 200px 80px, #c9d2ff, transparent),
        radial-gradient(1px 1px at 320px 220px, #ffffff, transparent),
        radial-gradient(1px 1px at 420px 60px, #d8b4ff, transparent),
        radial-gradient(1px 1px at 150px 300px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 500px 260px, #ffc59a, transparent);
      background-size: 520px 380px;
      opacity: 0.7;
      animation: twinkle 9s ease-in-out infinite reverse;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }

    .topbar, .grid { position: relative; z-index: 1; }

    /* Icons */
    [data-lucide] { display: inline-block; vertical-align: middle; }
    .moon [data-lucide] { width: 1.5rem; height: 1.5rem; color: #1A1222; }
    .sp-art [data-lucide] { width: 1.4rem; height: 1.4rem; color: #1A1222; }
    .sp-btn [data-lucide] { width: 20px; height: 20px; }
    .sp-btn.primary [data-lucide] { width: 18px; height: 18px; }
    .lib-play [data-lucide] { width: 15px; height: 15px; }
    .lib-del [data-lucide], .lib-dl [data-lucide] { width: 14px; height: 14px; }
    .btn [data-lucide] { width: 18px; height: 18px; }
    .panel-head h2 [data-lucide], .mixer-header h2 [data-lucide], .player-card h2 [data-lucide] { width: 15px; height: 15px; }
    .download-btn [data-lucide] { width: 14px; height: 14px; }

    /* Top bar */
    .topbar {
      flex: 0 0 auto;
      background: linear-gradient(110deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #fff;
      border: 3px solid var(--line);
      box-shadow: var(--shadow-sm);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .moon {
      background: var(--hi);
      color: var(--ink);
      border: 3px solid var(--line);
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #fff; }
    .topbar p { font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.92; margin-top: 2px; }

    /* Grid */
    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px, 1.05fr) minmax(280px, 0.95fr) minmax(300px, 1.1fr);
      gap: 14px;
    }
    .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

    /* Panel */
    .panel {
      background: var(--panel);
      border: 3px solid var(--line);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 3px solid var(--line); flex: 0 0 auto;
    }
    .panel-head h2 { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }

    label {
      display: block; font-size: 0.66rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--ink); margin-bottom: 5px;
    }

    /* Textarea */
    textarea {
      flex: 1 1 auto; min-height: 0; width: 100%;
      background: var(--panel-2);
      border: 3px solid var(--line);
      color: var(--ink);
      font-family: var(--mono); font-size: 0.9rem; line-height: 1.6;
      padding: 10px; resize: none; outline: none; overflow: auto; border-radius: 0;
    }
    textarea:focus { background: var(--field); box-shadow: inset 0 0 0 2px var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .text-stats {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; font-size: 0.7rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.03em; flex: 0 0 auto;
    }
    .est-duration { font-weight: 800; color: #1A1222; background: var(--hi); padding: 1px 6px; border: 2px solid var(--line); }
    .est-duration.hidden { opacity: 0; }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; flex: 0 0 auto; }
    .control-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

    select {
      background: var(--panel-2); border: 3px solid var(--line); color: var(--ink);
      font-family: var(--mono); font-size: 0.82rem; padding: 7px 8px; outline: none; cursor: pointer; border-radius: 0;
    }
    select:focus { background: var(--field); }

    .speed-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); cursor: pointer; height: 6px; }
    .speed-val { flex: 0 0 auto; font-size: 0.78rem; font-weight: 800; color: #1A1222; background: var(--hi); border: 2px solid var(--line); padding: 1px 6px; min-width: 3.1rem; text-align: center; white-space: nowrap; }

    /* Buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 11px 16px; border: 3px solid var(--line); font-family: var(--mono);
      font-size: 0.9rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
      cursor: pointer; border-radius: 0; box-shadow: var(--shadow-sm);
      transition: transform 0.08s, box-shadow 0.08s; margin-top: 12px; flex: 0 0 auto;
    }
    .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; box-shadow: none; transform: none; }

    /* Progress */
    .progress-wrap { display: none; flex-direction: column; gap: 6px; margin-top: 12px; flex: 0 0 auto; }
    .progress-wrap.visible { display: flex; }
    .progress-bar-bg { background: var(--panel-2); height: 14px; overflow: hidden; border: 3px solid var(--line); }
    .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
    .progress-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; }
    .status-dot { display: inline-block; width: 8px; height: 8px; background: var(--accent); animation: pulse 1.2s infinite; margin-right: 5px; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .error-msg {
      display: none; color: #fff; font-size: 0.76rem; margin-top: 10px; padding: 8px 10px;
      background: var(--danger); border: 3px solid var(--line); text-transform: uppercase; letter-spacing: 0.03em; flex: 0 0 auto;
    }
    .error-msg.visible { display: block; }

    /* Player */
    .player-card { display: none; flex: 0 0 auto; }
    .player-card.visible { display: flex; }
    .player-card h2 {
      font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--line); flex: 0 0 auto;
    }
    .sp-player { display: flex; flex-direction: column; gap: 12px; }
    .sp-info { display: flex; align-items: center; gap: 12px; }
    .sp-art {
      width: 48px; height: 48px; border: 3px solid var(--line); background: var(--hi);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sp-text { flex: 1; min-width: 0; }
    .sp-title { font-size: 0.92rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-meta { font-size: 0.68rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; }
    .sp-scrubber-row { display: flex; align-items: center; gap: 8px; }
    .sp-time { font-size: 0.66rem; font-weight: 700; color: var(--ink); min-width: 2.6rem; }
    .sp-time.right { text-align: right; }
    .sp-scrubber {
      flex: 1; -webkit-appearance: none; appearance: none; height: 8px;
      border: 2px solid var(--line); background: var(--panel-2); cursor: pointer;
    }
    .sp-scrubber::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--line); cursor: pointer; }
    .sp-controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
    .sp-btn {
      background: none; border: none; cursor: pointer; color: var(--ink);
      display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0; transition: transform 0.08s;
    }
    .sp-btn:active { transform: scale(0.9); }
    .sp-btn.primary { width: 46px; height: 46px; background: var(--accent); border: 3px solid var(--line); color: #fff; box-shadow: var(--shadow-sm); }
    .sp-btn.primary:active { transform: translate(2px, 2px); box-shadow: none; }
    .skip-label { font-size: 0.6rem; font-weight: 800; line-height: 1; }
    .sp-footer { display: flex; justify-content: flex-end; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: var(--hi); border: 3px solid var(--line); color: var(--ink);
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase; text-decoration: none;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .download-btn:active { transform: translate(2px, 2px); box-shadow: none; }

    /* Mixer */
    .mixer-card { flex: 1 1 auto; min-height: 0; }
    .mixer-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--line); flex: 0 0 auto;
    }
    .mixer-header h2 { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
    .mixer-toggle { position: relative; width: 46px; height: 24px; flex-shrink: 0; }
    .mixer-toggle input { opacity: 0; width: 0; height: 0; }
    .mixer-toggle-track { position: absolute; inset: 0; background: var(--panel-2); border: 3px solid var(--line); cursor: pointer; transition: background 0.15s; }
    .mixer-toggle input:checked + .mixer-toggle-track { background: var(--accent); }
    .mixer-toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--ink); transition: transform 0.15s; pointer-events: none; }
    .mixer-toggle input:checked ~ .mixer-toggle-thumb { transform: translateX(22px); background: #fff; }
    .sound-rows { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 4px; }
    .sound-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start;
      opacity: 0.45; transition: opacity 0.2s, background 0.2s; border: 2px solid var(--line); background: var(--panel-2); padding: 7px 9px;
    }
    .sound-row.active { opacity: 1; background: var(--panel-hi); border-color: var(--accent); }
    .sound-icon { font-size: 1.05rem; width: 1.5rem; text-align: center; grid-row: 1 / span 2; margin-top: 2px; }
    .sound-name { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; min-width: 0; }
    .sound-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 10px; }
    .sound-control { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 5px; min-width: 0; }
    .sound-control-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .sound-vol, .sound-pitch { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; width: 100%; }
    .sound-vol:disabled, .sound-pitch:disabled { cursor: default; }
    .sound-vol-val, .sound-pitch-val { font-size: 0.66rem; font-weight: 700; color: var(--ink); min-width: 2.6rem; text-align: right; }

    /* Library */
    .library-card { min-height: 0; }
    .lib-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 4px; }
    .library-empty { font-size: 0.76rem; color: var(--muted); text-align: center; padding: 16px 0; text-transform: uppercase; letter-spacing: 0.04em; }
    .lib-item { display: flex; align-items: center; gap: 10px; padding: 9px; border: 2px solid var(--line); background: var(--panel-2); margin-bottom: 8px; transition: background 0.15s; }
    .lib-item:hover { background: var(--panel-hi); }
    .lib-play {
      flex-shrink: 0; width: 34px; height: 34px; background: var(--accent); border: 3px solid var(--line);
      cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: var(--shadow-sm); transition: transform 0.08s, box-shadow 0.08s;
    }
    .lib-play:hover { background: var(--accent-h); }
    .lib-play:active { transform: translate(2px, 2px); box-shadow: none; }
    .lib-info { flex: 1; min-width: 0; }
    .lib-title { font-size: 0.84rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
    .lib-title:hover { color: var(--accent); }
    .lib-title-input { font-size: 0.84rem; font-family: var(--mono); color: var(--ink); background: var(--field); border: 2px solid var(--accent); padding: 2px 5px; width: 100%; outline: none; }
    .lib-meta { font-size: 0.64rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.02em; }
    .lib-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .lib-dl, .lib-del {
      padding: 5px 7px; border: 2px solid var(--line); font-family: var(--mono); font-size: 0.7rem; font-weight: 700;
      cursor: pointer; background: var(--panel); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; color: var(--ink);
    }
    .lib-dl:hover { background: var(--accent); color: #fff; }
    .lib-mp3 { background: var(--hi); color: #1A1222; }
    .lib-mp3:hover { background: var(--ok); color: #fff; }
    .lib-mp3:disabled { opacity: 0.5; cursor: not-allowed; }
    .lib-del:hover { background: var(--danger); color: #fff; }

    /* Modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(11, 11, 12, 0.55); z-index: 100; align-items: center; justify-content: center; }
    .modal-backdrop.visible { display: flex; }
    .modal { background: var(--panel); border: 3px solid var(--line); box-shadow: var(--shadow); padding: 20px; max-width: 380px; width: calc(100% - 2rem); display: flex; flex-direction: column; gap: 14px; }
    .modal-msg { font-size: 0.9rem; line-height: 1.5; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btn { padding: 8px 16px; border: 3px solid var(--line); font-family: var(--mono); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.08s, box-shadow 0.08s; }
    .modal-btn:active { transform: translate(2px, 2px); box-shadow: none; }
    .modal-btn.cancel { background: var(--panel-2); color: var(--ink); }
    .modal-btn.confirm { background: var(--danger); color: #fff; }
    .modal-btn.ok { background: var(--accent); color: #fff; }

    /* Responsive: below this, let the page scroll and stack */
    @media (max-width: 920px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .grid { grid-template-columns: 1fr; }
      .col { min-height: 0; }
      textarea { flex: 0 0 auto; height: 220px; }
      .mixer-card { flex: 0 0 auto; }
      .sound-rows, .lib-scroll { max-height: 340px; }
    }
    @media (max-width: 520px) {
      .controls { grid-template-columns: 1fr; }
      .sound-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <div class="sky"></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <header class="topbar">
    <span class="moon"><i data-lucide="moon"></i></span>
    <div>
      <h1>Read for Sleep</h1>
      <p>Paste text — get calm audio to drift off to</p>
    </div>
  </header>

  <main class="grid">

    <!-- Column 1: input -->
    <section class="panel panel-input">
      <div class="panel-head"><h2><i data-lucide="type"></i> Text</h2></div>
      <textarea id="textInput"
        placeholder="Paste your article, story, meditation script, or anything you want read to you while falling asleep..."></textarea>
      <div class="text-stats">
        <span><span id="wordCount">0</span> words · <span id="charCount">0</span> / 200,000</span>
        <span class="est-duration hidden" id="estDuration"></span>
      </div>

      <div class="controls">
        <div class="control-group">
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect"></select>
        </div>
        <div class="control-group">
          <label>Speed</label>
          <div class="speed-row">
            <input type="range" id="speedRange" min="0.5" max="1.2" step="0.05" value="0.8" />
            <span class="speed-val" id="speedVal">0.8×</span>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="generateBtn" onclick="startGeneration()">
        <i data-lucide="sparkles"></i> Generate
      </button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label">
          <span><span class="status-dot" id="statusDot"></span><span id="statusText">Generating audio…</span></span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
    </section>

    <!-- Column 2: player + mixer -->
    <div class="col">

      <section class="panel player-card" id="playerCard">
        <h2>Now playing</h2>
        <audio id="audioPlayer"></audio>

        <div class="sp-player">
          <div class="sp-info">
            <div class="sp-art"><i data-lucide="moon"></i></div>
            <div class="sp-text">
              <div class="sp-title" id="spTitle">—</div>
              <div class="sp-meta" id="spMeta"></div>
            </div>
          </div>

          <div class="sp-scrubber-row">
            <span class="sp-time" id="spCurrent">0:00</span>
            <input type="range" class="sp-scrubber" id="spScrubber" min="0" value="0" step="1" />
            <span class="sp-time right" id="spDuration">0:00</span>
          </div>

          <div class="sp-controls">
            <button class="sp-btn" onclick="seekRel(-15)" title="−15s">
              <i data-lucide="rotate-ccw"></i>
              <span class="skip-label">15</span>
            </button>
            <button class="sp-btn primary" id="spPlayPause" onclick="togglePlay()">
              <i data-lucide="play" id="spPlayIcon"></i>
            </button>
            <button class="sp-btn" onclick="seekRel(15)" title="+15s">
              <i data-lucide="rotate-cw"></i>
              <span class="skip-label">15</span>
            </button>
          </div>

          <div class="sp-footer">
            <a class="download-btn" id="downloadLink" download><i data-lucide="download"></i> Download</a>
          </div>
        </div>
      </section>

      <section class="panel mixer-card" id="mixerCard">
        <div class="mixer-header">
          <h2><i data-lucide="wind"></i> Ambient</h2>
          <label class="mixer-toggle" title="Enable ambient sounds">
            <input type="checkbox" id="mixerEnabled" onchange="onMixerToggle()" />
            <span class="mixer-toggle-track"></span>
            <span class="mixer-toggle-thumb"></span>
          </label>
        </div>
        <div class="sound-rows" id="soundRows">
          <p class="library-empty">Loading sounds…</p>
        </div>
      </section>

    </div>

    <!-- Column 3: library -->
    <section class="panel library-card" id="libraryCard">
      <div class="panel-head"><h2><i data-lucide="library"></i> Library</h2></div>
      <div class="lib-scroll" id="libraryList">
        <p class="library-empty">No recordings yet.</p>
      </div>
    </section>

  </main>

  <script>
    // ── Modal helpers ─────────────────────────────────────────────────────────────
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalMsg      = document.getElementById("modalMsg");
    const modalActions  = document.getElementById("modalActions");

    function showAlert(msg) {
      return new Promise(resolve => {
        modalMsg.textContent = msg;
        modalActions.innerHTML = "";
        const ok = document.createElement("button");
        ok.className = "modal-btn ok";
        ok.textContent = "OK";
        ok.onclick = () => { modalBackdrop.classList.remove("visible"); resolve(); };
        modalActions.appendChild(ok);
        modalBackdrop.classList.add("visible");
        ok.focus();
      });
    }

    function showConfirm(msg) {
      return new Promise(resolve => {
        modalMsg.textContent = msg;
        modalActions.innerHTML = "";
        const cancel = document.createElement("button");
        cancel.className = "modal-btn cancel";
        cancel.textContent = "Cancel";
        cancel.onclick = () => { modalBackdrop.classList.remove("visible"); resolve(false); };
        const confirm = document.createElement("button");
        confirm.className = "modal-btn confirm";
        confirm.textContent = "Delete";
        confirm.onclick = () => { modalBackdrop.classList.remove("visible"); resolve(true); };
        modalActions.append(cancel, confirm);
        modalBackdrop.classList.add("visible");
        confirm.focus();
      });
    }

    modalBackdrop.addEventListener("click", e => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove("visible");
    });

    const textInput = document.getElementById("textInput");
    const wordCount = document.getElementById("wordCount");
    const charCount = document.getElementById("charCount");
    const estDuration = document.getElementById("estDuration");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const generateBtn = document.getElementById("generateBtn");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    const progressPct = document.getElementById("progressPct");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const errorMsg = document.getElementById("errorMsg");
    const playerCard  = document.getElementById("playerCard");
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadLink = document.getElementById("downloadLink");
    const libraryList  = document.getElementById("libraryList");
    const spScrubber   = document.getElementById("spScrubber");
    const spPlayIcon   = document.getElementById("spPlayIcon");

    let pollTimer = null;
    let spSeeking = false;

    function setIcon(el, name) {
      el.setAttribute("data-lucide", name);
      lucide.createIcons({ nodes: [el] });
    }

    function fmtTime(s) {
      if (!isFinite(s)) return "0:00";
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    audioPlayer.addEventListener("timeupdate", () => {
      if (spSeeking) return;
      spScrubber.value = audioPlayer.currentTime;
      document.getElementById("spCurrent").textContent = fmtTime(audioPlayer.currentTime);
    });
    audioPlayer.addEventListener("loadedmetadata", () => {
      spScrubber.max = Math.floor(audioPlayer.duration);
      document.getElementById("spDuration").textContent = fmtTime(audioPlayer.duration);
    });
    audioPlayer.addEventListener("play",  () => setIcon(spPlayIcon, "pause"));
    audioPlayer.addEventListener("pause", () => setIcon(spPlayIcon, "play"));
    audioPlayer.addEventListener("ended", () => {
      setIcon(spPlayIcon, "play");
      document.querySelectorAll(".lib-play i").forEach(i => setIcon(i, "play"));
    });

    spScrubber.addEventListener("mousedown",  () => spSeeking = true);
    spScrubber.addEventListener("input",  () => document.getElementById("spCurrent").textContent = fmtTime(+spScrubber.value));
    spScrubber.addEventListener("change", () => { audioPlayer.currentTime = +spScrubber.value; spSeeking = false; });

    function togglePlay() {
      if (audioPlayer.paused) audioPlayer.play().catch(() => {});
      else audioPlayer.pause();
    }
    function seekRel(secs) {
      audioPlayer.currentTime = Math.max(0, Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + secs));
    }

    // ── Text stats ──────────────────────────────────────────────────────────────

    // Average spoken words per minute at speed 1.0 (natural reading pace ~150 wpm)
    const BASE_WPM = 150;

    function updateStats() {
      const text = textInput.value;
      const chars = text.length;
      const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      const speed = parseFloat(speedRange.value);

      charCount.textContent = chars.toLocaleString();
      wordCount.textContent = words.toLocaleString();

      if (words > 0) {
        const mins = words / (BASE_WPM * speed);
        estDuration.textContent = "≈ " + formatDuration(Math.round(mins * 60));
        estDuration.classList.remove("hidden");
      } else {
        estDuration.classList.add("hidden");
      }
    }

    textInput.addEventListener("input", updateStats);
    speedRange.addEventListener("input", () => {
      speedVal.textContent = parseFloat(speedRange.value).toFixed(2) + "×";
      updateStats();
    });

    // ── Voices ──────────────────────────────────────────────────────────────────

    fetch("/api/voices")
      .then(r => r.json())
      .then(voices => {
        const groups = {};
        voices.forEach(v => {
          if (!groups[v.lang]) groups[v.lang] = [];
          groups[v.lang].push(v);
        });
        Object.entries(groups).forEach(([lang, list]) => {
          const og = document.createElement("optgroup");
          og.label = lang;
          list.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.id;
            opt.textContent = v.name + (v.recommended ? " ⭐" : "");
            if (v.recommended) opt.selected = true;
            og.appendChild(opt);
          });
          voiceSelect.appendChild(og);
        });
      });

    // ── Helpers ─────────────────────────────────────────────────────────────────

    function formatDuration(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add("visible");
    }
    function clearError() {
      errorMsg.classList.remove("visible");
      errorMsg.textContent = "";
    }
    function setProgress(pct, label) {
      progressBar.style.width = pct + "%";
      progressPct.textContent = pct + "%";
      if (label) statusText.textContent = label;
    }

    // ── Generation ──────────────────────────────────────────────────────────────

    function startGeneration() {
      const text = textInput.value.trim();
      if (!text) { showError("Please paste some text first."); return; }
      if (text.length > 200000) { showError("Text is too long (max 200,000 chars)."); return; }

      clearError();
      generateBtn.disabled = true;
      progressWrap.classList.add("visible");
      playerCard.classList.remove("visible");
      statusDot.style.animation = "";
      statusDot.style.background = "";
      setProgress(0, "Sending text…");

      fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          voice: voiceSelect.value,
          speed: parseFloat(speedRange.value),
        }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.error) { handleError(data.error); return; }
          setProgress(2, "Model loading…");
          pollStatus(data.job_id);
        })
        .catch(e => handleError(e.message));
    }

    function pollStatus(jobId) {
      pollTimer = setInterval(() => {
        fetch(`/api/status/${jobId}`)
          .then(r => r.json())
          .then(job => {
            if (job.error) { handleError(job.error); return; }

            if (job.status === "processing") {
              const pct = Math.max(2, job.progress);
              const label = pct < 10 ? "Loading Kokoro model…"
                : pct < 95 ? `Synthesizing audio… (${pct}%)`
                  : "Finalizing…";
              setProgress(pct, label);
            }

            if (job.status === "done") {
              clearInterval(pollTimer);
              setProgress(100, "Done!");
              statusDot.style.animation = "none";
              statusDot.style.background = "var(--ok)";

              const audioUrl = `/api/audio/${job.filename}`;
              loadPlayer(audioUrl, "Your new recording", job.filename);
              playerCard.classList.add("visible");
              generateBtn.disabled = false;
              audioPlayer.play().catch(() => { });
              loadLibrary();
            }

            if (job.status === "error") {
              clearInterval(pollTimer);
              handleError(job.error || "Unknown error during generation.");
            }
          })
          .catch(e => { clearInterval(pollTimer); handleError(e.message); });
      }, 1500);
    }

    function handleError(msg) {
      clearInterval(pollTimer);
      progressWrap.classList.remove("visible");
      generateBtn.disabled = false;
      showError("Error: " + msg);
    }

    // ── Library ─────────────────────────────────────────────────────────────────

    function loadLibrary() {
      fetch("/api/library")
        .then(r => r.json())
        .then(items => {
          if (!items.length) {
            libraryList.innerHTML = '<p class="library-empty">No recordings yet.</p>';
            return;
          }

          libraryList.innerHTML = "";
          items.forEach(item => {
            const audioUrl = `/api/audio/${item.filename}`;
            const date = new Date(item.created_at * 1000).toLocaleDateString(undefined, {
              month: "short", day: "numeric", year: "numeric",
            });

            const isWav = item.filename.endsWith(".wav");
            const downloadName = isWav ? "sleep-audio.wav" : "sleep-audio.mp3";

            const row = document.createElement("div");
            row.className = "lib-item";
            row.dataset.filename = item.filename;
            row.innerHTML = `
            <button class="lib-play" title="Play" onclick="playLibItem('${audioUrl}', this)">
              <i data-lucide="play"></i>
            </button>
            <div class="lib-info">
              <div class="lib-title" title="Double-click to rename">${escHtml(item.title)}</div>
              <div class="lib-meta">${formatDuration(item.duration)} · ${escHtml(item.voice)} · ${date} · <strong>${isWav ? "WAV" : "MP3"}</strong></div>
            </div>
            <div class="lib-actions">
              ${isWav ? `<button class="lib-dl lib-mp3" title="Convert to MP3 320kbps" onclick="convertToMp3('${item.filename}', this)"><i data-lucide="file-audio"></i> MP3</button>` : ""}
              <a class="lib-dl" href="${audioUrl}" download="${downloadName}" title="Download"><i data-lucide="download"></i></a>
              <button class="lib-del" title="Delete" onclick="deleteItem('${item.filename}', this)"><i data-lucide="trash-2"></i></button>
            </div>
          `;
            row.querySelector(".lib-title").addEventListener("dblclick", function () {
              renameItem(item.filename, this);
            });
            libraryList.appendChild(row);
          });
          lucide.createIcons();
        });
    }

    function loadPlayer(url, title, filename) {
      audioPlayer.src = url;
      downloadLink.href = url;
      downloadLink.download = filename;
      document.getElementById("spTitle").textContent = title;
    }

    function playLibItem(url, btn) {
      document.querySelectorAll(".lib-play i").forEach(i => setIcon(i, "play"));
      const row   = btn.closest(".lib-item");
      const title = row?.querySelector(".lib-title")?.textContent || "Recording";
      const fname = row?.dataset.filename || "sleep-audio";
      loadPlayer(url, title, fname);
      playerCard.classList.add("visible");
      audioPlayer.play().catch(() => {});
      setIcon(btn.querySelector("i"), "square");
      audioPlayer.addEventListener("ended", () => { setIcon(btn.querySelector("i"), "play"); }, { once: true });
    }

    function convertToMp3(filename, btn) {
      btn.disabled = true;
      btn.innerHTML = "…";
      fetch(`/api/audio/${filename}/convert-mp3`, { method: "POST" })
        .then(r => r.json())
        .then(data => {
          if (data.error) { showAlert(data.error); btn.disabled = false; btn.textContent = "MP3"; return; }
          loadLibrary();
        })
        .catch(() => { btn.disabled = false; btn.textContent = "MP3"; showAlert("Conversion failed."); });
    }

    async function deleteItem(filename, btn) {
      const ok = await showConfirm("Delete this recording?");
      if (!ok) return;
      btn.disabled = true;
      fetch(`/api/audio/${filename}`, { method: "DELETE" })
        .then(r => r.json())
        .then(data => {
          if (data.error) { showAlert(data.error); btn.disabled = false; return; }
          const row = btn.closest(".lib-item");
          row.style.transition = "opacity 0.3s";
          row.style.opacity = "0";
          setTimeout(() => { row.remove(); checkEmpty(); }, 300);
        })
        .catch(() => { btn.disabled = false; showAlert("Delete failed."); });
    }

    function renameItem(filename, titleEl) {
      const current = titleEl.textContent;
      const input = document.createElement("input");
      input.className = "lib-title-input";
      input.value = current;
      titleEl.replaceWith(input);
      input.focus();
      input.select();

      function commit() {
        const newTitle = input.value.trim();
        if (!newTitle || newTitle === current) {
          input.replaceWith(titleEl);
          return;
        }
        fetch(`/api/audio/${filename}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: newTitle }),
        })
          .then(r => r.json())
          .then(data => {
            if (data.error) { showAlert(data.error); input.replaceWith(titleEl); return; }
            titleEl.textContent = data.title;
            input.replaceWith(titleEl);
            const row = titleEl.closest(".lib-item");
            if (row?.dataset.filename === filename) {
              document.getElementById("spTitle").textContent = data.title;
            }
          })
          .catch(() => { input.replaceWith(titleEl); showAlert("Rename failed."); });
      }

      input.addEventListener("blur", commit);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { input.blur(); }
        if (e.key === "Escape") { input.value = current; input.blur(); }
      });
    }

    function checkEmpty() {
      if (!libraryList.querySelector(".lib-item")) {
        libraryList.innerHTML = '<p class="library-empty">No recordings yet.</p>';
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Load library on page open
    loadLibrary();
    lucide.createIcons();

    // ── Ambient mixer ────────────────────────────────────────────────────────────

    const ambientTracks = {};

    function formatPitchLabel(value) {
      const semitones = parseFloat(value);
      const display = Number.isInteger(semitones)
        ? String(semitones)
        : semitones.toFixed(1).replace(/\.0$/, "");
      return `${semitones > 0 ? "+" : ""}${display} st`;
    }

    function applyPitchToAudio(audio, semitones) {
      const rate = Math.pow(2, semitones / 12);
      audio.defaultPlaybackRate = rate;
      audio.playbackRate = rate;
    }

    function disablePitchPreservation(audio) {
      if ("preservesPitch" in audio) audio.preservesPitch = false;
      if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = false;
      if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = false;
    }

    // Friendly display names and icons derived from filename
    function soundMeta(name) {
      const lower = name.toLowerCase();
      if (lower.startsWith("fire")) return { label: name.replace(/(\d+)$/, " $1").trim(), icon: "🔥" };
      if (lower.startsWith("rain")) return { label: name.replace(/(\d+)$/, " $1").trim(), icon: "🌧️" };
      if (lower.startsWith("wind")) return { label: name.replace(/(\d+)$/, " $1").trim(), icon: "💨" };
      if (lower.startsWith("ocean")) return { label: name.replace(/(\d+)$/, " $1").trim(), icon: "🌊" };
      if (lower.startsWith("bird")) return { label: name.replace(/(\d+)$/, " $1").trim(), icon: "🐦" };
      return { label: name, icon: "🎵" };
    }

    function loadSounds() {
      fetch("/api/sounds")
        .then(r => r.json())
        .then(sounds => {
          const container = document.getElementById("soundRows");
          if (!sounds.length) {
            container.innerHTML = '<p class="library-empty">No sounds found in /sounds folder.</p>';
            return;
          }
          container.innerHTML = "";
          sounds.forEach(s => {
            const { label, icon } = soundMeta(s.name);
            const row = document.createElement("div");
            row.className = "sound-row";
            row.id = `srow-${s.filename}`;
            row.innerHTML = `
            <span class="sound-icon">${icon}</span>
            <span class="sound-name">${escHtml(label)}</span>
            <div class="sound-controls">
              <label class="sound-control">
                <span class="sound-control-label">Vol</span>
                <input type="range" class="sound-vol" min="0" max="1" step="0.01" value="0.1"
                  disabled
                  oninput="onVolumeChange('${s.filename}', this.value)"
                  title="Volume" />
                <span class="sound-vol-val" id="vol-${s.filename}">10%</span>
              </label>
              <label class="sound-control">
                <span class="sound-control-label">Pitch</span>
                <input type="range" class="sound-pitch" min="-6" max="6" step="0.5" value="0"
                  disabled
                  oninput="onPitchChange('${s.filename}', this.value)"
                  title="Pitch" />
                <span class="sound-pitch-val" id="pitch-${s.filename}">0 st</span>
              </label>
            </div>
          `;
            container.appendChild(row);

            const audio = new Audio(`/sounds/${s.filename}`);
            audio.loop = true;
            audio.preload = "none";
            audio.volume = 0.1;
            disablePitchPreservation(audio);
            applyPitchToAudio(audio, 0);
            ambientTracks[s.filename] = { audio, pitch: 0 };
          });
        });
    }

    function onMixerToggle() {
      const enabled = document.getElementById("mixerEnabled").checked;
      Object.entries(ambientTracks).forEach(([filename, track]) => {
        const row = document.getElementById(`srow-${filename}`);
        const volumeSlider = row ? row.querySelector(".sound-vol") : null;
        const pitchSlider = row ? row.querySelector(".sound-pitch") : null;
        if (enabled) {
          if (volumeSlider) track.audio.volume = parseFloat(volumeSlider.value);
          if (pitchSlider) applyPitchToAudio(track.audio, parseFloat(pitchSlider.value));
          track.audio.play().catch(() => {});
          if (row) row.classList.add("active");
          if (volumeSlider) volumeSlider.disabled = false;
          if (pitchSlider) pitchSlider.disabled = false;
        } else {
          track.audio.pause();
          if (row) row.classList.remove("active");
          if (volumeSlider) volumeSlider.disabled = true;
          if (pitchSlider) pitchSlider.disabled = true;
        }
      });
    }

    function onVolumeChange(filename, value) {
      const track = ambientTracks[filename];
      if (track) track.audio.volume = parseFloat(value);
      const label = document.getElementById(`vol-${filename}`);
      if (label) label.textContent = Math.round(value * 100) + "%";
    }

    function onPitchChange(filename, value) {
      const track = ambientTracks[filename];
      if (track) {
        const semitones = parseFloat(value);
        track.pitch = semitones;
        applyPitchToAudio(track.audio, semitones);
      }
      const label = document.getElementById(`pitch-${filename}`);
      if (label) label.textContent = formatPitchLabel(value);
    }

    loadSounds();
  </script>
  <script>
    // Heartbeat: lets the server auto-shut-down when this tab closes.
    // A brief gap (reload/navigation) is tolerated by the server's watchdog.
    function ping() {
      fetch('/api/ping', { method: 'POST', keepalive: true }).catch(() => {});
    }
    ping();
    setInterval(ping, 5000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') ping();
    });
  </script>
</body>

</html>
